# ScopeFTP-server —— Docker Compose 部署
#
# 用法：
#   cp .env.example .env   # 修改 UPLOAD_APP_SECRET 等
#   docker compose up -d --build
#   docker compose logs -f
#
# 数据持久化在 deploy/data/（SQLite 元数据 + 上传文件），日志/审计在 deploy/logs/，升级镜像不影响数据。
name: scop-ftp

services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: scop-ftp-server:latest
    container_name: scop-ftp-server
    restart: unless-stopped
    environment:
      UPLOAD_APP_KEY: ${UPLOAD_APP_KEY:-demo-app}
      UPLOAD_APP_SECRET: ${UPLOAD_APP_SECRET:?请在 .env 中设置 UPLOAD_APP_SECRET}
      UPLOAD_DEVICE_BINDING_ENABLED: ${UPLOAD_DEVICE_BINDING_ENABLED:-true}
      UPLOAD_MAX_FILE_SIZE: ${UPLOAD_MAX_FILE_SIZE:-209715200}
      # 存储根：文件/元数据/临时文件都只在该根内（容器内固定挂载到 /app/data）
      UPLOAD_STORAGE_ROOTS: ${UPLOAD_STORAGE_ROOTS:-default=/app/data}
      UPLOAD_AUDIT_DIR: ${UPLOAD_AUDIT_DIR:-/app/logs/audit}
      UPLOAD_LOG_DIR: ${UPLOAD_LOG_DIR:-/app/logs}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /api/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -c 200 <&3 | grep -q '\"code\":0'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
