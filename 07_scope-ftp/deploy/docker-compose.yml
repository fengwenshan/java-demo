# ScopeFTP-server —— Docker Compose 部署
#
# 用法：
#   cp .env.example .env   # 至少改 UPLOAD_APP_SECRET
#   docker compose up -d --build
#   docker compose logs -f
#
# 容器默认激活 docker profile：构建镜像时若放入 application-docker.yml 则用它，
# 否则用 application.yml 默认值（8080、/app/data、/app/logs）；这里只传凭证与 JVM 参数。
# 数据持久化在 deploy/data/，日志/审计在 deploy/logs/，升级镜像不影响数据。
name: scop-ftp

services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: scop-ftp-server:latest
    container_name: scop-ftp-server
    restart: unless-stopped
    environment:
      # 如需其它环境文件（构建镜像时放入 jar），可传 SPRING_PROFILES_ACTIVE=<env>
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      UPLOAD_APP_KEY: ${UPLOAD_APP_KEY:-demo-app}
      UPLOAD_APP_SECRET: ${UPLOAD_APP_SECRET:?请在 .env 中设置 UPLOAD_APP_SECRET}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      # 服务端要求 /api/**（含 health）带 X-Device-Mac，否则会 403；这里显式补一行请求头。
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /api/health HTTP/1.0\\r\\nX-Device-Mac: 02:00:00:00:00:01\\r\\n\\r\\n' >&3 && head -c 200 <&3 | grep -q '\"code\":0'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
