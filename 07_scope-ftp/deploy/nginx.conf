# ScopeFTP-server —— Nginx 反向代理示例（生产必须 HTTPS）
#
# 使用：
#   1. 把证书放到 /etc/nginx/certs/（fullchain.pem / privkey.pem）
#   2. 替换下方 server_name 与证书路径
#   3. nginx -t && systemctl reload nginx
#
# 说明：客户端（Tauri）中填写的服务器地址应为 https://your-domain.com，
# 上传大文件时关闭请求缓冲（proxy_request_buffering off），并放宽超时。

upstream scop_ftp_backend {
    # 注意：必须与服务端实际端口一致。
    # default profile 默认 8080；xihu profile 默认 8787（见 application-xihu.yml）。
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name upload.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name upload.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # 上传大小限制需略大于服务端 max-file-size（默认 200MB）
    client_max_body_size 210m;
    client_body_timeout  300s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
        proxy_pass         http://scop_ftp_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # 大文件上传：不缓冲请求体，边收边转发
        proxy_request_buffering off;
        proxy_buffering         off;

        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # 健康检查（可只允许内网访问）
    location = /api/health {
        proxy_pass http://scop_ftp_backend;
        access_log off;
    }

    location / {
        return 404;
    }
}
