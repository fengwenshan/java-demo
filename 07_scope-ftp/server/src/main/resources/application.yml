# =============================================================================
# ScopeFTP-server —— 全局配置 + 可独立启动的默认值
#
# 【设计】本文件是仓库里唯一入库的配置文件，必须保证：没有任何
#   application-<env>.yml 环境文件时，`mvn package` 打出的 Jar 也能直接启动
#   （默认端口 8080、存储根 ./data、审计 ./logs/audit、演示客户端凭证）。
#   环境差异（端口/存储根/审计/日志/凭据/开关）用本地的 application-<env>.yml 覆盖；
#   这类环境文件一律不入库（见 07_scope-ftp/.gitignore），生产配置不要提交。
#     application-dev.yml        本机开发（本地覆盖，不入库）
#     application-docker.yml     容器部署（构建镜像时使用，不入库）
#     application-xiaoshan.yml   萧山生产（私有，不入库）
#     application-xihu.yml       西湖生产（私有，不入库）
#   新增环境：复制本文件为 application-<env>.yml，改端口/目录，然后 --env <名字> 启动。
#
# 【切换】./scripts/run-server.sh --env <名字>
#         java -jar app.jar --spring.profiles.active=<名字>
#   未指定时默认 dev（见下方 spring.profiles.default）；对应环境文件不存在时，
#   直接使用本文件里的默认值启动。
#
# 【唯一环境变量入口】客户端凭证注入：UPLOAD_APP_KEY / UPLOAD_APP_SECRET
#   （其它配置不要走环境变量，避免"覆盖"）。
# =============================================================================
server:
  address: 0.0.0.0
  # 默认端口；被占用时用 --server.port=8081 覆盖
  port: 9090

spring:
  application:
    name: ScopeFTP-server
  profiles:
    default: dev
  servlet:
    multipart:
      # 单文件 200MB、单请求 210MB（契约 3.5）：只约束「单次 multipart 上传」。
      # 大文件走分片上传（/api/files/upload/init + chunk + complete），
      # 其分片是 application/octet-stream 裸字节，不受 multipart 限制；上限由 app.storage.max-file-size 控制。
      max-file-size: 200MB
      max-request-size: 210MB
      file-size-threshold: 0B
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

# 全环境通用的业务默认值。环境文件可覆盖；没有环境文件时就是最终生效值。
app:
  security:
    # 允许的时间戳偏差（毫秒），默认 ±5 分钟
    timestamp-window-ms: 300000
    # nonce 缓存 TTL（毫秒），默认 10 分钟
    nonce-ttl-ms: 600000
    # 客户端身份强制校验（MAC/IP 黑名单 + verify→activate 顺序校验）：
    #   false（默认）：不拦截任何请求；
    #   true：所有 /api/**（含 /api/health）必须带合法 X-Device-Mac，缺失/非法或命中
    #         client_blacklist_ip / client_blacklist_mac 任一张表即 403 并写入黑名单。
    # 环境文件按需开启（dev/xiaoshan/xihu 开启）；测试 profile 显式关闭。
    client-identity-enforced: false
    # verify 成功后允许多久内调用 activate（毫秒），默认 10 分钟
    verify-activate-window-ms: 600000
    # 令牌桶限流：按 appKey + 客户端 IP
    rate-limit:
      capacity: 1000
      refill-per-second: 1
      upload-cost: 5
    # 客户端凭证：没有内置默认值，必须显式指定，否则启动失败。
    # 来源优先级：启动参数 --app-key/--app-secret > 环境变量 UPLOAD_APP_KEY/UPLOAD_APP_SECRET
    # > 当前环境文件 application-<env>.yml 的 app.security.clients。
    clients:
      - app-key: ${UPLOAD_APP_KEY:}
        app-secret: ${UPLOAD_APP_SECRET:}
        name: ${UPLOAD_APP_NAME:Tauri 桌面客户端}
        enabled: true
  storage:
    # 默认存储根（没有环境文件时使用；环境文件里的 roots[] 会整体覆盖本列表）
    roots:
      - id: root
        name: 默认目录
        path: ./data
    # 单文件上限（字节，5GiB）；单次 multipart 仍受上面 210MB 限制，超过 200MB 必须走分片上传
    max-file-size: 5368709120
    # 分片上传单片大小（字节，8MiB）：POST /api/files/upload/init 原样返回给客户端
    chunk-size: 8388608
    # 分片上传会话保留时长（毫秒，24 小时）
    session-ttl-ms: 86400000
    # 在线编辑文本上限（UTF-8 字节，2MiB）
    max-edit-bytes: 2097152
    # zip 解压防 bomb 上限：entry 数 / 解压总字节 / 单 entry 字节
    max-extract-entries: 20000
    max-extract-total-bytes: 1073741824
    max-extract-entry-bytes: 209715200
  audit:
    # 默认审计目录（没有环境文件时使用；不要放在任何存储根内）
    enabled: true
    dir: ./logs/audit
    max-body-chars: 4000
    max-history-days: 90
  terminal:
    # 默认开启（本机开发方便）；暴露公网/生产环境必须在环境文件里设 enabled: false
    enabled: true
    timeout-seconds: 10
    max-output-bytes: 262144
    max-sessions: 50

logging:
  level:
    root: INFO
    com.wenshan.upload: INFO
